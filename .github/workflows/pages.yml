name: pages

on:
  push:
    branches: [main]
    paths: ["www/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    uses: greylocklabs/.github/.github/workflows/pages.yml@v1

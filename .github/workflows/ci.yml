name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Android app arrives partway up the first stack; branches before it have only the Python tools.
      - name: Setup Java
        if: hashFiles('gradlew') != ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        if: hashFiles('gradlew') != ''
        uses: android-actions/setup-android@v4
        with:
          # The default also asks for "tools", which current command-line tools no longer ship.
          packages: platform-tools

      - name: Setup Gradle
        if: hashFiles('gradlew') != ''
        uses: gradle/actions/setup-gradle@v6

      - name: Changelog has the current version
        if: hashFiles('scripts/release-notes.sh') != ''
        run: scripts/release-notes.sh > /dev/null

      - name: Kotlin formatting
        if: hashFiles('gradlew') != ''
        run: ./gradlew spotlessCheck

      - name: Android lint
        if: hashFiles('gradlew') != ''
        run: ./gradlew lintDebug

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        if: hashFiles('gradlew') != ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        if: hashFiles('gradlew') != ''
        uses: android-actions/setup-android@v4
        with:
          # The default also asks for "tools", which current command-line tools no longer ship.
          packages: platform-tools

      - name: Setup Gradle
        if: hashFiles('gradlew') != ''
        uses: gradle/actions/setup-gradle@v6

      # Runs every unit and Robolectric test, comparing the screenshot tests against app/src/test/screenshots.
      - name: Unit, Robolectric and screenshot tests
        if: hashFiles('gradlew') != ''
        run: ./gradlew verifyRoborazziDebug

      - name: Upload screenshot differences
        if: failure() && hashFiles('gradlew') != ''
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: app/build/outputs/roborazzi

  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The report service arrives after the app; earlier branches have no worker/ to check.
      - name: Setup Node
        if: hashFiles('worker/package-lock.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Type-check and test the report service
        if: hashFiles('worker/package-lock.json') != ''
        working-directory: worker
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm test

  commitlint:
    uses: greylocklabs/.github/.github/workflows/commitlint.yml@v1
    with:
      config: commitlint.config.cjs
